[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  framework = "vite"
  targetPort = 5173
  port = 8888

[context.deploy-preview.environment]
  ATLAS_AUTH_MODE = "netlify-identity"

[context.branch-deploy.environment]
  ATLAS_AUTH_MODE = "netlify-identity"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
